[workspace]
authors = ["fgvieira"]
channels = ["conda-forge", "bioconda"]
name = "seqcenter"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
snakemake = ">=9.23.1,<10"
conda = ">=26.5.3,<27"
samshee = ">=0.2.14,<0.3"

[environments]
test = { features = ["test"] }
format = { features = ["format"], no-default-feature = true }

[feature.test.dependencies]
ipython = ">=9.15.0,<10"

[feature.format.dependencies]
black = ">=26.5.1,<27"
snakefmt = ">=2.0.3,<3"
