[workspace]
authors = ["fgvieira"]
channels = ["conda-forge", "bioconda"]
name = "seqcenter"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.0.0,<3.15"
plotly = ">=6.8.0,<7"
samshee = ">=0.2.14,<0.3"
pandas = ">=2.3.0,<3"
sqlalchemy = ">=2.0.45,<3"
psycopg2 = ">=2.9.11,<3"
miller = ">=6.19.0,<7"
time = ">=1.10,<2"

[environments]
test = { features = ["test"] }
format = { features = ["format"], no-default-feature = true }

[feature.test.dependencies]
ipython = ">=9.15.0,<10"

[feature.format.dependencies]
black = ">=26.5.1,<27"
